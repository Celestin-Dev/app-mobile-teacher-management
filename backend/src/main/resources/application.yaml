spring:
  application:
    name: manager

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teacher_eni_management_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:selesy20}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}   

server:
  port: ${PORT:8080}

logging:
  level:
    org:
      hibernate:
        SQL: ${SQL_LOG_LEVEL:debug}
        type:
          descriptor:
            sql: trace