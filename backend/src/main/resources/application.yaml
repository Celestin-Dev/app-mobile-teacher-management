spring:
  application:
    name: manager

  datasource:
    url: jdbc:postgresql://localhost:5432/teacher_eni_management_db
    username: postgres
    password: selesy20
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # options: none, validate, update, create, create-drop
